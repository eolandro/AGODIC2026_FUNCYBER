    de la misma.\nNotas: \n= Se propone usar herramientas opensource para la manipulacion
    de la imagen\n= Video o audios solo requieren un archivo de Texto con el enlace\n\
    = \"Un Video que documente el proceso\" no es necesariamente un tutorial o guia,
    es más bien el como realizaron una actividad, incluyendo sus errores, pensamientos
    e  ideas. Es más como un registro lofi\nElementos Clave: TestDisk, photorec, dd,
    binwalk.\nSEAES_CACEI: AE2, CD2-2, Compromiso con responsabilidad Social"
