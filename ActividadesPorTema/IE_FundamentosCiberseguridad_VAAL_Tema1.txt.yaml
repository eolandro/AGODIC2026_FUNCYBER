- Actividad: "Nombre: Demostración Tipos de amenazas y Riesgos\nDescripción: Realizar
    un video o presentacion en vivo de una amenaza o Riesgo de seguridad de ciberseguridad
    por equipos. Haciendo incapie en lo facil se puede ser victima de una de ellas\
    \ \nNotas: \n= Si la amenza es de software idealmente traer un ejemplo y presentar.\
    \ \n= Si es una vulnerabilidad de escala como un DDOS, entonces colocar un video.\
    \ \n= Si es por hardware intentar traer o armar el hardware.\nElementos Clave:
    Espinaje, Injeccion de codigo, Robo industrial, DDOS.\nSEAES_CACEI: AE2, CD2-2,
    Compromiso con responsabilidad Social"
