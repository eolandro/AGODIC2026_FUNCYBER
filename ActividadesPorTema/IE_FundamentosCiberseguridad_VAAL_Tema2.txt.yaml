    firmar archivos y administrar certificados de seguridad.\nNotas: \n= Deben usar
    GNUPG con kleopatra\n= Deben usar Openssl desde la linea de comandos\n= Los archivos
    de Texto va en formato PDF\n= Video o audios solo requieren un archivo de Texto
    con el enlace\nElementos Clave: GnuPG, kleopatra, Openssl, Libreoffice, SAT, CFDI.\n\
    SEAES_CACEI: AE2, CD2-2, Compromiso con responsabilidad Social"
