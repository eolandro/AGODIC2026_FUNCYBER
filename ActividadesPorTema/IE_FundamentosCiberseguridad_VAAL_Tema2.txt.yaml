- Actividad: "Nombre: Local CA\nDescripción: Realizar entidad certificadora local,
    que permita a un red lan certificar el acceso a servicios web locales.\nNotas:\
    \ \n = Montar un servidor DNS y configurarlo en la red local\n = Una maquina debe
    funcionar como CA\n = Otros equipos deben tener páginas web en un servidor HTTP\n\
    \ = Los servidores HTTP deben usar el certificado del CA\n = La navegacion en
    los sitios locales deben indicar que estan seguros\nElementos Clave: Mkcert, DNS.\n\
    SEAES_CACEI: CD2-2, AE2, CD7-2, AE7, Vanguadia."
  Reactivos:
  - ID: R003
    Ponderacion: 15
    Reactivo: "Reactivo: Implementar una red local.\n = Realizar un Diseño simple
      de la Topologia. En Papel o Digital\n = Configura la resolución de DNS para
      la red local\n = Instala servidores HTTP distintos para cada maquina que no
      es el CA y coloca un \"hola mundo\" en html.\nRestricciones: NA"
  - ID: R004
    Ponderacion: 20
    Reactivo: "Reactivo: Configurar el CA\n = Generar las llaves y el certificado
      Raiz en la máquina CA con mkcert.\n = Importa el certificado Raiz en los equipos\n\
      \ = Genera los certificados para los servidores web, con mkcert usando el certificado
      Raiz.\n = Configura los servidores web y verifica que la conexion es segura..\
      \ \nRestricciones: NA"
